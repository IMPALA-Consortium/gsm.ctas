template:
  bootstrap: 5

navbar:
  structure:
    left: [articles, reference, news]
    right: [search, github]

articles:
- title: Get started
  navbar: ~
  contents:
  - gsm-ctas

reference:
- title: Mapping
  desc: Map SDTM domains into the CTAS long-format vocabulary.
  contents:
  - FilterVisits
  - Standardize_Domain
  - Standardize_Queries
  - starts_with("Input_")
- title: Preparation
  desc: Make values comparable across parameters.
  contents:
  - starts_with("Prepare_")
- title: Analysis
  desc: Run CTAS and emit ctasapp-shaped shards.
  contents:
  - Analyze_CTAS
- title: Reporting
  desc: Bind ctasapp shards and write them to disk for the ctasapp dashboard.
  contents:
  - Bind_Analysis
  - Write_ctasapp
- title: Package
  contents:
  - gsm.ctas-package
- title: Datasets
  desc: Illustrative SDTM domains and EDC query records shipped with the package.
  contents:
  - dm
  - lb
  - vs
  - eg
  - rs
  - queries

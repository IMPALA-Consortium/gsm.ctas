template:
  bootstrap: 5

navbar:
  structure:
    left: [articles, reference, news]
    right: [search, github]

articles:
- title: Get started
  navbar: ~
  contents:
  - gsm-ctas

reference:
- title: Mapping
  desc: Map SDTM domains into the CTAS long-format vocabulary.
  contents:
  - Standardize_Domain
  - Standardize_Queries
  - starts_with("Transform_")
- title: Analysis
  desc: Run CTAS and emit the ctasapp-shaped output frames.
  contents:
  - Analyze_CTAS
- title: Reporting
  desc: Bind the ctasapp output frames and write them to disk for the ctasapp dashboard.
  contents:
  - Bind_Analysis
  - Write_ctasapp
- title: Summary
  desc: Aggregate CTAS results into gsm KRI-shaped summary + metric + group meta for the standard gsm.kri report.
  contents:
  - Summarize_CTAS
  - Flag_CTAS
  - MakeMetric_CTAS
  - Report_CTAS
- title: Package
  contents:
  - gsm.ctas-package
- title: Datasets
  desc: Illustrative SDTM domains and EDC query records shipped with the package.
  contents:
  - dm
  - lb
  - vs
  - eg
  - rs
  - queries

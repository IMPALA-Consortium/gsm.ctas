meta:
  Type: Analysis
  ID: numeric
  FeatureAutocorr: true
  FeatureAverage: true
  FeatureSD: true
  FeatureRange: false
  FeatureUniqueValueCountRelative: true
  FeatureOwnSiteSimilScore: false
  FeatureLOF: false
  MinTimepoints: 3
  MinSubjects: 3
  MaxShareMissing: 0.5
  ScoringMethod: ks
  PadjustMethod: fdr
  Seed: 20260813
spec:
  Mapped_Subjects:
    studyid:
      type: character
    subject_id:
      type: character
    site:
      type: character
    country:
      type: character
  Mapped_VS:
    STUDYID:
      type: character
    USUBJID:
      type: character
    VSTESTCD:
      type: character
    VSTEST:
      type: character
    VSSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  # Rename SDTM columns to the CTAS vocabulary and stamp the category. The
  # visit filter has already run in the mapping layer, so we disable it here.
  - output: Temp_CTAS_Values
    name: gsm.ctas::Standardize_Domain
    params:
      dfDomain: Mapped_VS
      dfSubjects: Mapped_Subjects
      strTestCDCol: VSTESTCD
      strTestCol: VSTEST
      strValueCol: VSSTRESN
      strCategory: Vital Signs
      strExcludePattern: ~
  # `Standardize_Domain` already emits the numeric CTAS vocab, so no
  # separate Input step is needed for this metric.
  - output: Temp_CTAS_Results
    name: gsm.ctas::Analyze_CTAS
    params:
      df: Temp_CTAS_Values
      bAutocorr: FeatureAutocorr
      bAverage: FeatureAverage
      bSD: FeatureSD
      bRange: FeatureRange
      bUniqueValueCountRelative: FeatureUniqueValueCountRelative
      bOwnSiteSimilScore: FeatureOwnSiteSimilScore
      bLOF: FeatureLOF
      nMinTimepoints: MinTimepoints
      nMinSubjects: MinSubjects
      dMaxShareMissing: MaxShareMissing
      strScoringMethod: ScoringMethod
      strPadjustMethod: PadjustMethod
      nSeed: Seed
  # `Temp_CTAS_Values` carries no `original_value`, so no `untransformed`
  # is emitted for this metric.
  - output: lAnalysis
    name: base::list
    params:
      ID: ID
      results: Temp_CTAS_Results
      input: Temp_CTAS_Values

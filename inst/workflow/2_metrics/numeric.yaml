meta:
  Type: Analysis
  ID: numeric
  FeatureAutocorr: true
  FeatureAverage: true
  FeatureSD: true
  FeatureRange: false
  FeatureUniqueValueCountRelative: true
  FeatureOwnSiteSimilScore: false
  FeatureLOF: false
  MinTimepoints: 3
  MinSubjects: 3
  MaxShareMissing: 0.5
  ScoringMethod: ks
  PadjustMethod: fdr
  Seed: 20260813
spec:
  Mapped_Subjects:
    studyid:
      type: character
    subject_id:
      type: character
    site:
      type: character
    country:
      type: character
  Mapped_VS:
    STUDYID:
      type: character
    USUBJID:
      type: character
    VSTESTCD:
      type: character
    VSTEST:
      type: character
    VSSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  - output: Temp_CTAS_Subjects
    name: gsm.ctas::Input_Subjects
    params:
      dfDM: Mapped_Subjects
  # Column overrides here are the whole data-type transform: point the generic
  # `Input_Numeric` at the raw SDTM column names of the numeric source (VS).
  - output: Temp_CTAS_Values
    name: gsm.ctas::Input_Numeric
    params:
      dfDomain: Mapped_VS
      strStudyCol: STUDYID
      strSubjectCol: USUBJID
      strTestCDCol: VSTESTCD
      strTestCol: VSTEST
      strValueCol: VSSTRESN
      strVisitCol: VISIT
      strVisitNumCol: VISITNUM
      strCategoryCol: ~
      strCategory: Vital Signs
  - output: Temp_CTAS_Input
    name: gsm.ctas::Combine_CTAS_Input
    params:
      lNumeric: Temp_CTAS_Values
      dfSubjects: Temp_CTAS_Subjects
  - output: lAnalysis
    name: gsm.ctas::Analyze_CTAS
    params:
      lInput: Temp_CTAS_Input
      strID: ID
      bAutocorr: FeatureAutocorr
      bAverage: FeatureAverage
      bSD: FeatureSD
      bRange: FeatureRange
      bUniqueValueCountRelative: FeatureUniqueValueCountRelative
      bOwnSiteSimilScore: FeatureOwnSiteSimilScore
      bLOF: FeatureLOF
      nMinTimepoints: MinTimepoints
      nMinSubjects: MinSubjects
      dMaxShareMissing: MaxShareMissing
      strScoringMethod: ScoringMethod
      strPadjustMethod: PadjustMethod
      nSeed: Seed

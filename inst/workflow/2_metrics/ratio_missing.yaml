meta:
  Type: Analysis
  ID: ratio_missing
  # `autocorr` is dropped: a running ratio is monotonic and its autocorrelation
  # carries no additional information.
  FeatureAutocorr: false
  FeatureAverage: true
  FeatureSD: true
  FeatureRange: false
  FeatureUniqueValueCountRelative: true
  FeatureOwnSiteSimilScore: false
  FeatureLOF: false
  MinTimepoints: 3
  MinSubjects: 3
  MaxShareMissing: 0.5
  ScoringMethod: ks
  PadjustMethod: fdr
  Seed: 20260813
spec:
  Mapped_Subjects:
    studyid:
      type: character
    subject_id:
      type: character
    site:
      type: character
    country:
      type: character
  Mapped_LB:
    STUDYID:
      type: character
    USUBJID:
      type: character
    LBTESTCD:
      type: character
    LBTEST:
      type: character
    LBSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  - output: Temp_CTAS_Subjects
    name: gsm.ctas::Input_Subjects
    params:
      dfDM: Mapped_Subjects
  # NA values in LBSTRESN are the missingness signal `Input_Missing` picks up.
  - output: Temp_CTAS_Values
    name: gsm.ctas::Input_Missing
    params:
      dfDomain: Mapped_LB
      strStudyCol: STUDYID
      strSubjectCol: USUBJID
      strTestCDCol: LBTESTCD
      strTestCol: LBTEST
      strValueCol: LBSTRESN
      strVisitCol: VISIT
      strVisitNumCol: VISITNUM
      strCategoryCol: ~
      strCategory: Labs
  - output: Temp_CTAS_Input
    name: gsm.ctas::Combine_CTAS_Input
    params:
      lMissing: Temp_CTAS_Values
      dfSubjects: Temp_CTAS_Subjects
  - output: lAnalysis
    name: gsm.ctas::Analyze_CTAS
    params:
      lInput: Temp_CTAS_Input
      strID: ID
      bAutocorr: FeatureAutocorr
      bAverage: FeatureAverage
      bSD: FeatureSD
      bRange: FeatureRange
      bUniqueValueCountRelative: FeatureUniqueValueCountRelative
      bOwnSiteSimilScore: FeatureOwnSiteSimilScore
      bLOF: FeatureLOF
      nMinTimepoints: MinTimepoints
      nMinSubjects: MinSubjects
      dMaxShareMissing: MaxShareMissing
      strScoringMethod: ScoringMethod
      strPadjustMethod: PadjustMethod
      nSeed: Seed

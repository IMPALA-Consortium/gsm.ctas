meta:
  Type: Analysis
  ID: ratio_missing
  # `autocorr` is dropped: a running ratio is monotonic and its autocorrelation
  # carries no additional information.
  FeatureAutocorr: false
  FeatureAverage: true
  FeatureSD: true
  FeatureRange: false
  FeatureUniqueValueCountRelative: false
  FeatureOwnSiteSimilScore: false
  FeatureLOF: false
  MinTimepoints: 1
  MinSubjects: 25
  MaxShareMissing: 0.3
  ScoringMethod: ks
  PadjustMethod: fdr
  Seed: 20260813
spec:
  Mapped_Subjects:
    studyid:
      type: character
    subject_id:
      type: character
    site:
      type: character
    country:
      type: character
  Mapped_LB:
    STUDYID:
      type: character
    USUBJID:
      type: character
    LBTESTCD:
      type: character
    LBTEST:
      type: character
    LBSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
  Mapped_VS:
    STUDYID:
      type: character
    USUBJID:
      type: character
    VSTESTCD:
      type: character
    VSTEST:
      type: character
    VSSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
  Mapped_EG:
    STUDYID:
      type: character
    USUBJID:
      type: character
    EGTESTCD:
      type: character
    EGTEST:
      type: character
    EGSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  # Each numeric source domain gets its own `Standardize_Domain` call so the
  # per-row `parameter_category_1` traces back to the source. Downstream
  # steps are category-agnostic.
  - output: Temp_LB_Long
    name: gsm.ctas::Standardize_Domain
    params:
      dfDomain: Mapped_LB
      dfSubjects: Mapped_Subjects
      strTestCDCol: LBTESTCD
      strTestCol: LBTEST
      strValueCol: LBSTRESN
      strCategory: Labs
      strExcludePattern: ~
  - output: Temp_VS_Long
    name: gsm.ctas::Standardize_Domain
    params:
      dfDomain: Mapped_VS
      dfSubjects: Mapped_Subjects
      strTestCDCol: VSTESTCD
      strTestCol: VSTEST
      strValueCol: VSSTRESN
      strCategory: Vital Signs
      strExcludePattern: ~
  - output: Temp_EG_Long
    name: gsm.ctas::Standardize_Domain
    params:
      dfDomain: Mapped_EG
      dfSubjects: Mapped_Subjects
      strTestCDCol: EGTESTCD
      strTestCol: EGTEST
      strValueCol: EGSTRESN
      strCategory: ECG
      strExcludePattern: ~
  # LB / VS / EG testcodes are disjoint, so `parameter_id` uniqueness is
  # preserved after row-binding.
  - output: Temp_CTAS_Long
    name: dplyr::bind_rows
    params:
      lb: Temp_LB_Long
      vs: Temp_VS_Long
      eg: Temp_EG_Long
  # NA values in the source *STRESN columns are the missingness signal
  # `Input_Missing` picks up.
  - output: Temp_CTAS_Values
    name: gsm.ctas::Input_Missing
    params:
      df: Temp_CTAS_Long
  - output: Temp_CTAS_Results
    name: gsm.ctas::Analyze_CTAS
    params:
      df: Temp_CTAS_Values
      bAutocorr: FeatureAutocorr
      bAverage: FeatureAverage
      bSD: FeatureSD
      bRange: FeatureRange
      bUniqueValueCountRelative: FeatureUniqueValueCountRelative
      bOwnSiteSimilScore: FeatureOwnSiteSimilScore
      bLOF: FeatureLOF
      nMinTimepoints: MinTimepoints
      nMinSubjects: MinSubjects
      dMaxShareMissing: MaxShareMissing
      strScoringMethod: ScoringMethod
      strPadjustMethod: PadjustMethod
      nSeed: Seed
  - output: lAnalysis
    name: base::list
    params:
      ID: ID
      results: Temp_CTAS_Results
      input: Temp_CTAS_Values

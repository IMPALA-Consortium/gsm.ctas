meta:
  Type: Analysis
  ID: ratio_missing
  # `autocorr` is dropped: a running ratio is monotonic and its autocorrelation
  # carries no additional information.
  FeatureAutocorr: false
  FeatureAverage: true
  FeatureSD: true
  FeatureRange: false
  FeatureUniqueValueCountRelative: true
  FeatureOwnSiteSimilScore: false
  FeatureLOF: false
  MinTimepoints: 1
  MinSubjects: 25
  MaxShareMissing: 0.3
  ScoringMethod: ks
  PadjustMethod: fdr
  Seed: 20260813
spec:
  Mapped_Subjects:
    studyid:
      type: character
    subject_id:
      type: character
    site:
      type: character
    country:
      type: character
  Mapped_LB:
    STUDYID:
      type: character
    USUBJID:
      type: character
    LBTESTCD:
      type: character
    LBTEST:
      type: character
    LBSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  - output: Temp_CTAS_Long
    name: gsm.ctas::Standardize_Domain
    params:
      dfDomain: Mapped_LB
      dfSubjects: Mapped_Subjects
      strTestCDCol: LBTESTCD
      strTestCol: LBTEST
      strValueCol: LBSTRESN
      strCategory: Labs
      strExcludePattern: ~
  # NA values in LBSTRESN are the missingness signal `Input_Missing` picks up.
  - output: Temp_CTAS_Values
    name: gsm.ctas::Input_Missing
    params:
      df: Temp_CTAS_Long
  - output: Temp_CTAS_Results
    name: gsm.ctas::Analyze_CTAS
    params:
      df: Temp_CTAS_Values
      bAutocorr: FeatureAutocorr
      bAverage: FeatureAverage
      bSD: FeatureSD
      bRange: FeatureRange
      bUniqueValueCountRelative: FeatureUniqueValueCountRelative
      bOwnSiteSimilScore: FeatureOwnSiteSimilScore
      bLOF: FeatureLOF
      nMinTimepoints: MinTimepoints
      nMinSubjects: MinSubjects
      dMaxShareMissing: MaxShareMissing
      strScoringMethod: ScoringMethod
      strPadjustMethod: PadjustMethod
      nSeed: Seed
  - output: lAnalysis
    name: base::list
    params:
      ID: ID
      results: Temp_CTAS_Results
      input: Temp_CTAS_Values

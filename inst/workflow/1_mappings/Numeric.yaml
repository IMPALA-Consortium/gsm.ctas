meta:
  Type: Mapped
  ID: Numeric
  Description: Standardised numeric findings frame for CTAS input, derived from Mapped_VS
  Priority: 2
spec:
  Mapped_VS:
    STUDYID:
      type: character
    USUBJID:
      type: character
    VSTESTCD:
      type: character
    VSTEST:
      type: character
    VSSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  # `Mapped_Numeric` is the transformation-typed long frame consumed by the
  # `numeric` metric. Adding another numeric source (e.g. EG) means unioning it
  # in here, not touching a metric YAML.
  - output: Mapped_Numeric
    name: workr::RunQuery
    params:
      df: Mapped_VS
      strQuery: |
        SELECT
          STUDYID as studyid,
          USUBJID as subject_id,
          VSTESTCD as parameter_id,
          VSTEST as parameter_name,
          'Vital Signs' as parameter_category_1,
          VISIT as visit,
          VISITNUM as visitnum,
          VSSTRESN as value
        FROM df

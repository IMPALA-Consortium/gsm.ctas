meta:
  Type: Mapped
  ID: CTAS_Input
  Description: Map SDTM domains into the five CTAS input frames
  Priority: 3
spec:
  Mapped_DM:
    USUBJID:
      type: character
    SITEID:
      type: character
    COUNTRY:
      type: character
  Mapped_VS:
    USUBJID:
      type: character
    VSTESTCD:
      type: character
    VSTEST:
      type: character
    VSSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
  Mapped_LB:
    USUBJID:
      type: character
    LBTESTCD:
      type: character
    LBTEST:
      type: character
    LBSTRESN:
      type: numeric
    LBSTNRLO:
      type: numeric
    LBSTNRHI:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  - output: Temp_CTAS_Subjects
    name: gsm.ctas::Input_Subjects
    params:
      dfDM: Mapped_DM
      strSubjectCol: USUBJID
      strSiteCol: SITEID
      strCountryCol: COUNTRY
  - output: Temp_CTAS_VS
    name: gsm.ctas::Input_Numeric
    params:
      dfDomain: Mapped_VS
      strSubjectCol: USUBJID
      strTestCDCol: VSTESTCD
      strTestCol: VSTEST
      strValueCol: VSSTRESN
      strVisitCol: VISIT
      strVisitNumCol: VISITNUM
      strExcludePattern: unsch
      strCategory: Vital Signs
      strPrefix: VS
  # Labs are mapped twice from the same domain, because the two questions are
  # different: LB_NORM asks whether a site's *values* deviate once the reference
  # range has made tests comparable, LB_MISS asks whether its *completeness*
  # does. The value-based input drops missing results, so it cannot see the
  # second.
  - output: Temp_CTAS_LB_Range
    name: gsm.ctas::Input_Range
    params:
      dfDomain: Mapped_LB
      strSubjectCol: USUBJID
      strTestCDCol: LBTESTCD
      strTestCol: LBTEST
      strValueCol: LBSTRESN
      strLowCol: LBSTNRLO
      strHighCol: LBSTNRHI
      strVisitCol: VISIT
      strVisitNumCol: VISITNUM
      strExcludePattern: unsch
      strCategory: Labs
      strPrefix: LB_NORM
  - output: Temp_CTAS_LB_Missing
    name: gsm.ctas::Input_Missing
    params:
      dfDomain: Mapped_LB
      strSubjectCol: USUBJID
      strTestCDCol: LBTESTCD
      strTestCol: LBTEST
      strValueCol: LBSTRESN
      strVisitCol: VISIT
      strVisitNumCol: VISITNUM
      strExcludePattern: unsch
      strCategory: Labs
      strPrefix: LB_MISS
  - output: Mapped_CTAS_Input
    name: gsm.ctas::Combine_CTAS_Input
    params:
      dfVS: Temp_CTAS_VS
      dfLBRange: Temp_CTAS_LB_Range
      dfLBMissing: Temp_CTAS_LB_Missing
      dfSubjects: Temp_CTAS_Subjects

meta:
  Type: Mapped
  ID: VS
  Description: SDTM VS (Vital Signs) Data Mapping
  Priority: 1
spec:
  Raw_VS:
    STUDYID:
      type: character
    USUBJID:
      type: character
    VSTESTCD:
      type: character
    VSTEST:
      type: character
    VSSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  - output: Temp_VS_Raw
    name: workr::RunQuery
    params:
      df: Raw_VS
      strQuery: "SELECT * FROM df"
  # Unscheduled visits are dropped in the mapping layer so every downstream
  # standardised frame is filtered the same way without each metric YAML having
  # to remember to do it.
  - output: Mapped_VS
    name: gsm.ctas::FilterVisits
    params:
      dfInput: Temp_VS_Raw
      strVisitCol: VISIT
      strExcludePattern: unsch

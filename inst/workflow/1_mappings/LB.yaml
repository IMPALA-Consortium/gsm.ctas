meta:
  Type: Mapped
  ID: LB
  Description: SDTM LB (Laboratory Test Results) Data Mapping
  Priority: 1
spec:
  Raw_LB:
    STUDYID:
      type: character
    USUBJID:
      type: character
    LBTESTCD:
      type: character
    LBTEST:
      type: character
    LBSTRESN:
      type: numeric
    LBSTNRLO:
      type: numeric
    LBSTNRHI:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  - output: Temp_LB_Raw
    name: workr::RunQuery
    params:
      df: Raw_LB
      strQuery: "SELECT * FROM df"
  - output: Mapped_LB
    name: gsm.ctas::FilterVisits
    params:
      dfInput: Temp_LB_Raw
      strVisitCol: VISIT
      strExcludePattern: unsch

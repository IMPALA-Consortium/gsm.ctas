meta:
  Type: Mapped
  ID: SITE
  Description: Site Metadata Derived from DM
  Priority: 2
spec:
  Mapped_DM:
    STUDYID:
      type: character
    USUBJID:
      type: character
    SITEID:
      type: character
    COUNTRY:
      type: character
steps:
  - output: Temp_SiteWide
    name: workr::RunQuery
    params:
      df: Mapped_DM
      strQuery: |
        SELECT
          SITEID as GroupID,
          MAX(STUDYID) as StudyID,
          MAX(COUNTRY) as Country,
          COUNT(DISTINCT USUBJID) as ParticipantCount
        FROM df
        GROUP BY SITEID
  - output: Mapped_SITE
    name: gsm.mapping::MakeLongMeta
    params:
      data: Temp_SiteWide
      strGroupLevel: Site

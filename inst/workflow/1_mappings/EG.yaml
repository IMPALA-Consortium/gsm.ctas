meta:
  Type: Mapped
  ID: EG
  Description: SDTM EG (Electrocardiogram) Data Mapping
  Priority: 1
spec:
  Raw_EG:
    STUDYID:
      type: character
    USUBJID:
      type: character
    EGTESTCD:
      type: character
    EGTEST:
      type: character
    EGSTRESN:
      type: numeric
    VISIT:
      type: character
    VISITNUM:
      type: numeric
steps:
  - output: Temp_EG_Raw
    name: workr::RunQuery
    params:
      df: Raw_EG
      strQuery: "SELECT * FROM df"
  # Unscheduled visits are dropped in the mapping layer so every downstream
  # standardised frame is filtered the same way without each metric YAML having
  # to remember to do it.
  - output: Mapped_EG
    name: gsm.ctas::FilterVisits
    params:
      dfInput: Temp_EG_Raw
      strVisitCol: VISIT
      strExcludePattern: unsch
